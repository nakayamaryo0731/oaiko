name: Deploy Production
run-name: Deploy Production ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン (例: v1.0.1)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # tag 作成 + production ブランチへの push に必要

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Use vX.Y.Z (e.g. v1.0.1)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # tag 操作 + production push に必要

      - uses: ./.github/actions/setup

      - name: Create tag (fail if exists)
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists. Use a different version."
            exit 1
          fi
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Stamp version into lib/version.ts
        run: |
          cat > lib/version.ts <<EOF
          // AUTO-GENERATED by Deploy Production workflow. Do not edit manually.
          // staging では "v0.0.0" のまま、production deploy 時のみ上書きされる。
          export const APP_VERSION = "${{ inputs.version }}";
          EOF
          git add lib/version.ts
          git commit -m "release: ${{ inputs.version }}"

      - name: Deploy Convex (production)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm dlx convex deploy --yes

      - name: Promote to production branch (Netlify auto-builds it)
        run: git push origin HEAD:refs/heads/production --force-with-lease

      - name: Summary
        run: echo "🚀 Deployed ${{ inputs.version }} to production"
