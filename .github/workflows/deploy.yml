name: Deploy

on:
  # main にマージされたら staging へ自動デプロイ
  push:
    branches: [main]
  # production へは手動 dispatch（バージョン入力）
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン (例: v1.0.1)"
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 作成 + production ブランチへの push に必要

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        if: steps.target.outputs.env == 'production'
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Use vX.Y.Z (e.g. v1.0.1)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # production: main HEAD を起点に release commit を作る
          # staging: trigger された commit
          ref: ${{ steps.target.outputs.env == 'production' && 'main' || github.sha }}
          fetch-depth: 0 # tag 操作 + production push に必要

      - uses: ./.github/actions/setup

      - name: Create tag (production only, idempotent)
        if: steps.target.outputs.env == 'production'
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists, skipping"
          else
            git tag "${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi

      - name: Stamp version (production only)
        if: steps.target.outputs.env == 'production'
        run: |
          echo "// AUTO-GENERATED by Deploy workflow. Do not edit manually." > lib/version.ts
          echo "// staging では \"v0.0.0\" のまま、production deploy 時のみ上書きされる。" >> lib/version.ts
          echo "export const APP_VERSION = \"${{ inputs.version }}\";" >> lib/version.ts
          git add lib/version.ts
          git commit -m "release: ${{ inputs.version }}"

      - name: Deploy Convex
        env:
          # prod は既存の CONVEX_DEPLOY_KEY を流用、staging だけ新規追加
          CONVEX_DEPLOY_KEY: ${{ steps.target.outputs.env == 'production' && secrets.CONVEX_DEPLOY_KEY || secrets.CONVEX_DEPLOY_KEY_STAGING }}
        run: pnpm dlx convex deploy --yes

      - name: Promote to production branch (Netlify auto-builds it)
        if: steps.target.outputs.env == 'production'
        run: git push origin HEAD:refs/heads/production --force-with-lease

      - name: Summary
        run: |
          echo "🚀 Deployed ${{ inputs.version || github.sha }} to ${{ steps.target.outputs.env }}"
