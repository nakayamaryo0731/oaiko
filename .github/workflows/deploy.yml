name: Deploy

on:
  # main にマージされたら staging へ自動デプロイ
  push:
    branches: [main]
  # production へは手動 dispatch（タグ指定）
  workflow_dispatch:
    inputs:
      ref:
        description: "デプロイする ref (例: v1.0.1)"
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # production ブランチへの push 用

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "label=$([ -n "${{ github.event.inputs.ref }}" ] && echo "${{ github.event.inputs.ref }}" || echo main)" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "label=main@${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}

      - uses: ./.github/actions/setup

      - name: Deploy Convex
        env:
          # prod は既存の CONVEX_DEPLOY_KEY を流用、staging だけ新規追加
          CONVEX_DEPLOY_KEY: ${{ steps.target.outputs.env == 'production' && secrets.CONVEX_DEPLOY_KEY || secrets.CONVEX_DEPLOY_KEY_STAGING }}
        run: pnpm dlx convex deploy --yes

      - name: Promote to production branch (Netlify auto-builds it)
        # production branch を tag commit に force-with-lease で進める。
        # Netlify prod site の Production branch = "production" なので、
        # この push を契機に Netlify が auto-build → 本番反映される。
        # staging の場合は何もしない（Netlify が main の auto-build を回す）。
        if: steps.target.outputs.env == 'production'
        run: |
          git push origin HEAD:refs/heads/production --force-with-lease

      - name: Summary
        run: |
          echo "🚀 Deployed ${{ steps.target.outputs.label }} to ${{ steps.target.outputs.env }}"
